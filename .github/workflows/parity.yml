name: API parity ledger

on: [push, pull_request]

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install . pytest
        env:
          FLASHINFER_AOT_ALL: "0"
      - name: Validate packaged ledgers without GPU or NPU dependencies
        working-directory: /tmp
        run: python -m flashinfer parity-check
      - run: python -m pytest tests/test_manifests.py tests/test_parity_nvidia.py tests/test_parity_tracking.py -q
