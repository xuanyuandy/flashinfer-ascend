<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 615" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#37474f"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#78909c"/>
    </marker>
  </defs>

  <!-- 主链路：用户调用 -->
  <rect x="390" y="18" width="160" height="34" rx="6" fill="#ffffff" stroke="#37474f" stroke-width="1.5"/>
  <text x="470" y="36" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#212121">用户调用</text>
  <line x1="470" y1="52" x2="470" y2="80" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 对外 API -->
  <rect x="340" y="84" width="260" height="34" rx="6" fill="#ffffff" stroke="#37474f" stroke-width="1.5"/>
  <text x="470" y="102" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#212121">对外 API（flashinfer.xx）</text>
  <line x1="470" y1="118" x2="470" y2="146" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 构建输入签名 -->
  <rect x="380" y="150" width="180" height="34" rx="6" fill="#ffffff" stroke="#37474f" stroke-width="1.5"/>
  <text x="470" y="168" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#212121">构建输入签名</text>
  <line x1="470" y1="184" x2="470" y2="210" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Dispatcher（决策点） -->
  <polygon points="470,212 585,255 470,298 355,255" fill="#e3f2fd" stroke="#37474f" stroke-width="1.5"/>
  <text x="470" y="256" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#0d47a1">Dispatcher</text>

  <!-- 决策输入（虚线） -->
  <rect x="20" y="205" width="130" height="30" rx="6" fill="#fafafa" stroke="#78909c" stroke-width="1.2"/>
  <text x="85" y="221" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#546e7a">硬件签名</text>
  <rect x="20" y="250" width="130" height="30" rx="6" fill="#fafafa" stroke="#78909c" stroke-width="1.2"/>
  <text x="85" y="266" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#546e7a">Tuning DB</text>
  <rect x="20" y="295" width="130" height="30" rx="6" fill="#fafafa" stroke="#78909c" stroke-width="1.2"/>
  <text x="85" y="311" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#546e7a">用户自定义 kernel</text>
  <line x1="150" y1="220" x2="350" y2="252" stroke="#78909c" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ad)"/>
  <line x1="150" y1="265" x2="350" y2="255" stroke="#78909c" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ad)"/>
  <line x1="150" y1="310" x2="350" y2="258" stroke="#78909c" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ad)"/>

  <!-- L2 Backend 三选一 -->
  <rect x="190" y="340" width="170" height="38" rx="6" fill="#f1f8e9" stroke="#37474f" stroke-width="1.5"/>
  <text x="275" y="360" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#212121">CANN 算子</text>
  <rect x="385" y="340" width="170" height="38" rx="6" fill="#f1f8e9" stroke="#37474f" stroke-width="1.5"/>
  <text x="470" y="360" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#212121">AOT 预编译产物</text>
  <rect x="580" y="340" width="170" height="38" rx="6" fill="#f1f8e9" stroke="#37474f" stroke-width="1.5"/>
  <text x="665" y="360" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#212121">JIT 现场编译</text>
  <line x1="470" y1="298" x2="277" y2="336" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="470" y1="298" x2="470" y2="336" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="470" y1="298" x2="663" y2="336" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 汇入 ACL Runtime -->
  <rect x="390" y="446" width="160" height="34" rx="6" fill="#ffffff" stroke="#37474f" stroke-width="1.5"/>
  <text x="470" y="464" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#212121">ACL Runtime（CANN）</text>
  <line x1="275" y1="378" x2="436" y2="442" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="470" y1="378" x2="470" y2="442" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="665" y1="378" x2="504" y2="442" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Ascend AI Core -->
  <line x1="470" y1="480" x2="470" y2="510" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="390" y="514" width="160" height="34" rx="6" fill="#ffffff" stroke="#37474f" stroke-width="1.5"/>
  <text x="470" y="532" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#212121">Ascend AI Core</text>

  <!-- 图例 -->
  <line x1="20" y1="585" x2="64" y2="585" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="74" y="590" font-size="13" fill="#546e7a">执行链路</text>
  <line x1="170" y1="585" x2="214" y2="585" stroke="#78909c" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ad)"/>
  <text x="224" y="590" font-size="13" fill="#546e7a">Dispatcher 的决策输入</text>
</svg>
