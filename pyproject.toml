[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashinfer"
version = "0.1.0.dev0"
description = "FlashInfer-style inference kernel library for Ascend NPU"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [{name = "FlashInfer Contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
include = ["flashinfer*"]

[tool.setuptools.package-data]
flashinfer = ["data/*.json", "data/kernels/*.json", "tuning/data/manifest.json", "tuning/data/*/measurements.sqlite3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_compile: invokes a real compiler or builds/loads real compiled artifacts on disk (including JIT compilation on cache misses)",
]
